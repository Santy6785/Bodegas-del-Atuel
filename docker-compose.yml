# =====================================================================
# docker-compose.yml - Bodegas del Atuel
#
# Infraestructura base: Servicio de Base de Datos PostgreSQL.
#
# Configuración sensible:
#   Toda variable sensible o de entorno debe definirse en un archivo .env
#   (copiar .env.example a .env antes de iniciar).
# =====================================================================

services:
  ########################################################################
  # db - PostgreSQL 16
  # Base de datos relacional para el sistema Bodegas del Atuel.
  #
  # Inicialización de migraciones:
  #   El directorio ./db/migrations se monta como solo lectura (:ro) en
  #   /docker-entrypoint-initdb.d. La imagen oficial de PostgreSQL ejecuta
  #   automáticamente los scripts .sql en orden alfabético estricto (001_,
  #   002_, etc.) ÚNICAMENTE cuando el volumen de datos está vacío (en la
  #   primera creación del contenedor). Si el volumen ya contiene datos,
  #   el entrypoint omite la ejecución para proteger la base existente.
  ########################################################################
  db:
    image: postgres:16
    container_name: bodegas-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-owner_bodegas}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?define POSTGRES_PASSWORD en .env}
      POSTGRES_DB: ${POSTGRES_DB:-bodegas_atuel}
    ports:
      # Puerto expuesto en el host; configurable por si el 5432 está ocupado
      - "${DB_PORT:-5432}:5432"
    volumes:
      # Volumen con nombre para persistir los datos de la base
      - pgdata:/var/lib/postgresql/data
      # Montaje de solo lectura de las migraciones para inicialización automática
      - ./db/migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-owner_bodegas} -d ${POSTGRES_DB:-bodegas_atuel}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - bodegas_net

  ########################################################################
  # api - API REST (Preparado para incorporar en etapas posteriores)
  ########################################################################
  # api:
  #   build:
  #     context: ./api
  #     dockerfile: Dockerfile
  #   container_name: bodegas-api
  #   restart: unless-stopped
  #   environment:
  #     DB_HOST: db
  #     DB_PORT: 5432
  #     DB_NAME: ${POSTGRES_DB:-bodegas_atuel}
  #     DB_USER: ${DB_USER:-app_rw}
  #     DB_PASSWORD: ${DB_PASSWORD:?define DB_PASSWORD en .env}
  #     API_PORT: ${API_PORT:-8000}
  #   depends_on:
  #     db:
  #       condition: service_healthy
  #   ports:
  #     - "${API_PORT:-8000}:8000"
  #   networks:
  #     - bodegas_net

  ########################################################################
  # front - Frontend Cliente (Preparado para incorporar en etapas posteriores)
  ########################################################################
  # front:
  #   build:
  #     context: ./front
  #     dockerfile: Dockerfile
  #   container_name: bodegas-front
  #   restart: unless-stopped
  #   depends_on:
  #     - api
  #   ports:
  #     - "${FRONT_PORT:-5173}:80"
  #   networks:
  #     - bodegas_net

# Red interna para comunicación aislada entre servicios
networks:
  bodegas_net:
    driver: bridge

# Volumen nombrado para persistencia de datos del motor PostgreSQL
volumes:
  pgdata:
    name: pgdata

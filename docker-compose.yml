# =====================================================================
# docker-compose.yml - Bodegas del Atuel
#
# Infraestructura base: Servicio de Base de Datos PostgreSQL.
#
# Configuración sensible:
#   Toda variable sensible o de entorno debe definirse en un archivo .env
#   (copiar .env.example a .env antes de iniciar).
# =====================================================================

services:
  ########################################################################
  # db - PostgreSQL 16
  # Base de datos relacional para el sistema Bodegas del Atuel.
  #
  # Inicialización de migraciones:
  #   Las migraciones se ejecutan de forma explícita y controlada mediante
  #   el script ./scripts/migrate.sh con soporte transaccional y ON_ERROR_STOP.
  #   Para evitar ejecuciones automáticas no controladas y garantizar consistencia
  #   entre entornos (local y nube), NO se montan en /docker-entrypoint-initdb.d.
  ########################################################################
  db:
    build:
      context: ./db
      dockerfile: Dockerfile
    container_name: bodegas-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-owner_bodegas}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?define POSTGRES_PASSWORD en .env}
      POSTGRES_DB: ${POSTGRES_DB:-bodegas_atuel}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:?define APP_DB_PASSWORD en .env}
      RO_DB_PASSWORD: ${APP_RO_PASSWORD:-cambiar_por_un_secreto_ro}
    ports:
      - "${DB_PORT:-5433}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test:
        - "CMD-SHELL"
        - "pg_isready -h 127.0.0.1 -U $$POSTGRES_USER -d $$POSTGRES_DB && PGPASSWORD=$$POSTGRES_PASSWORD psql -h 127.0.0.1 -U $$POSTGRES_USER -d $$POSTGRES_DB -tAc \"SELECT to_regclass('public.vino')\" | grep -q vino"
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s
    networks:
      - bodegas_net

  ########################################################################
  # seed - Carga de datos iniciales (seed) en PostgreSQL
  ########################################################################
  seed:
    restart: "no"
    build:
      context: .
      dockerfile: db/Dockerfile.seed
    container_name: bodegas-seed
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGHOST: db
      PGPORT: 5432
      PGDATABASE: ${POSTGRES_DB:-bodegas_atuel}
      PGUSER: ${POSTGRES_USER:-owner_bodegas}
      PGPASSWORD: ${POSTGRES_PASSWORD:?define POSTGRES_PASSWORD en .env}
      SEED_PERMITIR_OTRA_BASE: "1"
    networks:
      - bodegas_net

  ########################################################################
  # api - API REST
  ########################################################################
  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    container_name: bodegas-api
    restart: unless-stopped
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: ${POSTGRES_DB:-bodegas_atuel}
      DB_USER: ${DB_USER:-app_rw}
      DB_PASSWORD: ${DB_PASSWORD:?define DB_PASSWORD en .env}
      API_PORT: ${API_PORT:-8000}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173,http://localhost:5500,http://127.0.0.1:5173,http://127.0.0.1:5500}
    depends_on:
      db:
        condition: service_healthy
      seed:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/salud')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    ports:
      - "${API_PORT:-8000}:8000"
    networks:
      - bodegas_net

  ########################################################################
  # front - Frontend Cliente (Preparado para incorporar en etapas posteriores)
  ########################################################################
  front:
    build:
      context: ./front
      dockerfile: Dockerfile
    container_name: bodegas-front
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "${FRONT_PORT:-5173}:80"
    networks:
      - bodegas_net

# Red interna para comunicación aislada entre servicios
networks:
  bodegas_net:
    driver: bridge

# Volumen nombrado para persistencia de datos del motor PostgreSQL
volumes:
  pgdata:
    name: pgdata
